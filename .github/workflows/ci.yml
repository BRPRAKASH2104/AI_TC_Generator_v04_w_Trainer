name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install ruff
        run: pip install ruff>=0.9.1

      - name: Run ruff check
        # Whole-repo scope (review 2026-07-20 Recommended 10): tests and
        # utilities are now held to the same style gate as core source, after
        # the one-time repo-wide format pass on 2026-07-22.
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  type-check:
    name: Type Checking (MyPy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Run mypy
        # Scope widened (review 2026-07-20 Recommended 10) to include main.py and
        # utilities/ after the 2026-07-22 annotation cleanup made them type-clean.
        # tests/ stays out of the gate: it carries pre-existing errors that are a
        # separate, larger clean-up task (see CLAUDE.md).
        run: mypy src/ main.py utilities/ --python-version 3.14 --ignore-missing-imports

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/integration --cov=src --cov-report=xml --cov-report=term-missing -m "not integration and not slow"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  test-integration-mock:
    name: Integration Tests (mock-backed)
    runs-on: ubuntu-latest
    # Always runs. Covers the mock-backed tests under tests/integration/ that
    # the unit job excludes via --ignore=tests/integration. These stub the
    # Ollama transport, so they need no external service and gate every PR.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Run mock-backed integration tests
        # `-m "not integration"` skips tests marked as requiring a live Ollama
        # (test_ollama_schema_smoke.py, the real_integration cases); those run
        # only in the opt-in job below.
        run: pytest tests/integration -v -m "not integration and not slow"

  test-integration-ollama:
    name: Integration Tests (real Ollama, opt-in)
    runs-on: ubuntu-latest
    # Opt-in only: pulling llama3.1:8b takes several minutes, so this does not
    # gate every PR. Trigger manually via the "Run workflow" button
    # (workflow_dispatch). Kept green-or-informative, not a merge blocker.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull llama3.1:8b

      - name: Run real-Ollama integration tests
        run: pytest tests/integration -v -m integration

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit security scan
        # Policy: any Bandit finding fails the job (bandit exits non-zero when
        # issues are reported). The former four B314 XML-parser findings were
        # resolved at source by switching to defusedxml (see src/core/*.py),
        # so no suppression/baseline is carried — new findings surface loudly.
        run: bandit -r src/ -f json -o bandit-report.json

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
        if: always()

  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install project dependencies
        run: pip install -e .

      - name: Run pip-audit
        # Policy: a known dependency vulnerability FAILS the build (no
        # continue-on-error). Advisories that are reviewed and accepted as
        # non-exploitable / unfixable are added to --ignore-vuln with a dated
        # justification below, so the ignore list is an explicit, auditable
        # record rather than a blanket bypass. Empty today: nothing accepted.
        run: pip-audit --strict

  build-check:
    name: Build & Package Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install build tools
        run: |
          pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Smoke-test installed wheel in a clean environment
        run: |
          set -euo pipefail
          # Install the built wheel into a fresh venv OUTSIDE the repository so
          # the source checkout cannot leak onto sys.path and mask packaging
          # defects (e.g. missing `main` module or prompt/config assets).
          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir/venv"
          wheel="$(ls "$PWD"/dist/*.whl | head -n1)"
          "$smoke_dir/venv/bin/pip" install --upgrade pip
          "$smoke_dir/venv/bin/pip" install "$wheel"
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/ai-tc-generator" --help
          "$smoke_dir/venv/bin/ai-tc-generator" --validate-prompts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  validate-prompts:
    name: Validate YAML Prompts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Validate prompt templates
        run: python -c "from src.yaml_prompt_manager import YAMLPromptManager; mgr = YAMLPromptManager(); print('✅ All prompt templates valid')"

  verify-doc-examples:
    name: Verify Documented Shell Examples
    runs-on: ubuntu-latest
    # Runs the documented CLI/utility invocations that need neither Ollama nor a
    # real input file, so the docs stay a reliable contract (review 2026-07-20
    # Recommended finding 7).
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Verify documented shell examples
        run: bash scripts/verify_doc_examples.sh
