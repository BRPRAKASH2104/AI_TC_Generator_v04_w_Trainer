# =================================================================
# Prompt System Configuration
# File: prompts/config/prompt_config.yaml
#
# Only settings actually read by YAMLPromptManager are listed here.
# =================================================================

# File paths and locations
file_paths:
  test_generation_prompts: "prompts/templates/test_generation_adaptive.yaml"
  error_handling_prompts: "prompts/templates/error_handling.yaml"

# Default settings
defaults:
  template_selection: "adaptive_default"
  variable_format: "{variable_name}"

# Automatic template selection (rules live in the template file under
# prompt_selection: heading_keywords / requirement_id_patterns / default_template)
auto_selection:
  enabled: true
  fallback_to_default: true
